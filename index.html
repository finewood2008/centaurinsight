<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centaur Insight | 私行级 AI 商业顾问</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050505',
                        glass: 'rgba(20, 20, 20, 0.6)',
                        accent: '#4ade80',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            overscroll-behavior-y: none;
        }

        .glass-card {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
        }

        .camera-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .camera-btn:active { transform: scale(0.98); }

        .btn-glow {
            background: #ffffff;
            color: #000000;
            transition: all 0.3s ease;
        }
        
        .view-hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-ai {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem 0.75rem 0.75rem 0;
        }
        .chat-user {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 0.75rem 0.75rem 0 0.75rem;
            color: #4ade80;
        }

        .typing-indicator span {
            display: inline-block;
            width: 4px; height: 4px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .radar-box {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 1px solid rgba(74, 222, 128, 0.3);
            position: relative;
            overflow: hidden;
        }
        .radar-box::before {
            content: ''; position: absolute; inset: 0;
            background: conic-gradient(transparent 70%, rgba(74, 222, 128, 0.8) 100%);
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Markdown 样式 */
        .markdown-body strong { color: #4ade80; font-weight: 600; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative w-full max-w-md mx-auto">

    <!-- Header -->
    <header class="p-6 flex flex-col items-center justify-center shrink-0 z-50 bg-dark/80 backdrop-blur-md">
        <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center mb-2 shadow-[0_0_15px_rgba(255,255,255,0.2)]">
            <i data-lucide="layers" class="w-6 h-6 text-black"></i>
        </div>
        <h1 class="text-lg font-semibold tracking-wider">CENTAUR INSIGHT</h1>
        <p class="text-[10px] text-accent tracking-widest font-mono opacity-80 uppercase mt-1">Deep AI Consultant</p>
    </header>

    <!-- 步骤 1：扫描名片入场 -->
    <main id="step-1" class="flex-grow px-6 flex flex-col justify-center fade-in z-10 pb-20">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-light mb-3 leading-tight">拍摄名片<br><span class="font-semibold text-white">开启专属商业推演</span></h2>
            <p class="text-sm text-gray-400">系统将自动提取企业档案，极速连线顾问</p>
        </div>

        <div class="space-y-6 w-full">
            <input type="file" id="cam-card" accept="image/*" capture="environment" onchange="handleCapture()" style="display: none;">
            
            <button type="button" onclick="document.getElementById('cam-card').click()" id="btn-card"
                    class="camera-btn w-full h-40 rounded-2xl flex flex-col items-center justify-center gap-4 group">
                <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-white/10 transition">
                    <i data-lucide="scan-face" class="w-8 h-8 text-accent"></i>
                </div>
                <span class="text-sm text-gray-300 font-medium tracking-wide">点击拍摄名片或上传相册</span>
            </button>
        </div>
    </main>

    <!-- 步骤 1.5：识别过渡页 -->
    <main id="step-loading" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-dark/90 backdrop-blur view-hidden">
        <div class="radar-box mb-8 shadow-[0_0_30px_rgba(74,222,128,0.2)]"></div>
        <h3 class="text-lg font-medium mb-2 tracking-widest text-accent font-mono">档案解析中...</h3>
        <p class="text-xs text-gray-400 font-mono text-center">压缩上传完成，正在提炼企业核心特征</p>
    </main>

    <!-- 步骤 2：互动推演界面 -->
    <main id="step-2" class="absolute inset-0 top-[110px] z-20 flex flex-col bg-dark view-hidden">
        <div id="chat-box" class="flex-grow p-5 overflow-y-auto flex flex-col gap-5 pb-28 custom-scrollbar"></div>

        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-dark via-dark to-transparent z-30">
            <div id="chat-input-wrapper" class="glass-card flex items-end gap-2 p-2 relative fade-in">
                <textarea id="chat-input" rows="1" 
                          class="w-full bg-transparent text-sm text-white px-3 py-2 outline-none resize-none max-h-24 custom-scrollbar placeholder-gray-500" 
                          placeholder="描述您的业务痛点..."
                          oninput="autoResize(this)"></textarea>
                <button onclick="sendMessage()" id="btn-send" class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center shrink-0 hover:bg-accent/20 transition-colors">
                    <i data-lucide="arrow-up" class="w-5 h-5 text-accent"></i>
                </button>
            </div>

            <!-- 收网留资表单 (预填邮箱) -->
            <div id="lead-gen-wrapper" class="glass-card p-4 view-hidden fade-in border-accent/30 shadow-[0_0_30px_rgba(74,222,128,0.1)]">
                <p class="text-xs text-accent font-mono mb-3 text-center">◆ 完整战略报告已生成，请确认接收邮箱 ◆</p>
                <div class="flex gap-2">
                    <input type="email" id="email-input" class="flex-grow bg-white/5 border border-white/20 text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:border-accent" placeholder="您的企业邮箱">
                    <button onclick="submitLead()" class="px-5 rounded-lg bg-accent text-black font-semibold text-sm hover:bg-green-300">
                        确定接收
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 步骤 3：成功页面 -->
    <div id="step-3" class="absolute inset-0 z-50 flex items-center justify-center bg-dark view-hidden">
        <div class="text-center fade-in px-6">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 bg-accent/20 rounded-full animate-ping"></div>
                <div class="relative w-full h-full rounded-full border-2 border-accent flex items-center justify-center bg-dark">
                    <i data-lucide="send" class="w-8 h-8 text-accent ml-1"></i>
                </div>
            </div>
            <h2 class="text-2xl font-light mb-3">研报投递中</h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8">
                高级战略研究员将在二次核验后<br>将定制报告发送至您的邮箱。
            </p>
            <button onclick="location.reload()" class="text-xs text-gray-500 tracking-widest font-mono uppercase hover:text-white transition-colors">
                [ 返回首页迎接下一位访客 ]
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const PROXY_URL = "https://gemini-proxy.finewood2008.workers.dev";
        
        let extractedData = { name: "贵宾", title: "负责人", company: "贵公司", email: "", industry: "未知赛道" };
        let chatHistory = [];
        let turnCount = 0; 

        // 极限压缩算法：限制宽600px，压缩率0.6，确保图片在50KB内，弱网也能秒传
        function compressImage(file, maxWidth = 600) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        resolve(dataUrl.split(',')[1]); // return base64 part
                    };
                    img.onerror = reject;
                };
            });
        }

        async function handleCapture() {
            const fileInput = document.getElementById('cam-card');
            if(fileInput.files && fileInput.files[0]) {
                document.getElementById('step-1').classList.add('view-hidden');
                document.getElementById('step-loading').classList.remove('view-hidden');

                try {
                    const file = fileInput.files[0];
                    const base64Data = await compressImage(file);
                    await extractCardInfo(base64Data);
                } catch (e) {
                    console.error("压缩或识别失败", e);
                    // 容错处理：即使识别失败也进入对话
                    startChat(); 
                }
            }
        }

        async function extractCardInfo(base64Data) {
            const requestBody = {
                contents: [{
                    parts: [
                        { text: "请精准提取这张名片的信息，必须严格返回以下JSON格式（不要加任何代码块修饰符，纯JSON字符串）：{\"name\": \"姓名或留空\", \"title\": \"职位或负责人\", \"company\": \"公司全称或留空\", \"email\": \"邮箱或留空\", \"industry\": \"根据公司名称和业务推测的所属行业/赛道\"}" },
                        { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                    ]
                }]
            };

            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
                const parsed = JSON.parse(aiText);
                
                if (parsed.name) extractedData.name = parsed.name.split(' ')[0]; // 拿个姓氏或短名
                if (parsed.title) extractedData.title = parsed.title;
                if (parsed.company) extractedData.company = parsed.company;
                if (parsed.email) extractedData.email = parsed.email;
                if (parsed.industry) extractedData.industry = parsed.industry;

                startChat();
            } catch (err) {
                console.error("提取失败", err);
                startChat(); // Fallback
            }
        }

        function startChat() {
            document.getElementById('step-loading').classList.add('view-hidden');
            document.getElementById('step-2').classList.remove('view-hidden');

            const isKnown = extractedData.company !== "贵公司";
            const honorific = isKnown ? `**${extractedData.name}** ${extractedData.title}` : `贵宾`;

            // 大模型系统人设指令
            const SYSTEM_PROMPT = `你是顶尖的麦肯锡级AI商业战略顾问。现在在展会现场与【${extractedData.company}】（所属赛道：${extractedData.industry}）的 ${honorific} 对话。
核心原则：
1. 字数极度克制（100字左右），多用专业短句，拒绝废话。
2. 犀利、一针见血，展现高级感。
3. 接下来的对话流程：第一轮你只负责给高含金量破局建议（Wow Moment）。然后顺势收网，告诉客户完整报告已生成发邮箱，坚决不再提问。`;

            chatHistory = [{ role: "user", parts: [{ text: SYSTEM_PROMPT }] }, { role: "model", parts: [{ text: "明白，严格执行高管级顾问人设及收网流程。" }] }];

            // AI 的主动首条开场白（无需请求大模型，直接抛出，响应极快）
            const openingMsg = `你好，${honorific}。系统已扫描建立**【${extractedData.company}】**的商业基本盘。<br><br>基于你们在**【${extractedData.industry}】**赛道的现状，请告诉我，贵司当前最核心的痛点是寻找高质量的大客户线索，还是突破价格内卷实现品牌溢价？（或者描述其他业务瓶颈）`;
            
            appendAiMsg(marked.parse(openingMsg));
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        async function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            appendUserMsg(text);

            turnCount++;

            let promptToSend = text;
            if (turnCount >= 1) {
                promptToSend += "\n\n(System Note: 请针对痛点给出极其犀利的破局思路。说完后立刻结尾告知：现场演示时间有限，《定制化深度战略报告》已打包完毕，要求客户确认底部邮箱接收，绝不提出任何新问题。)";
            }

            await fetchAIResponse(promptToSend);
            
            if (turnCount >= 1) {
                setTimeout(() => {
                    document.getElementById('chat-input-wrapper').classList.add('view-hidden');
                    document.getElementById('lead-gen-wrapper').classList.remove('view-hidden');
                    if(extractedData.email) {
                        document.getElementById('email-input').value = extractedData.email;
                    }
                    scrollToBottom();
                }, 1500);
            }
        }

        async function fetchAIResponse(userText) {
            chatHistory.push({ role: "user", parts: [{ text: userText }] });
            const typingId = showTypingIndicator();

            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                if (!response.ok) throw new Error("Network error");
                const data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                removeTypingIndicator(typingId);
                appendAiMsg(marked.parse(aiText));

            } catch (error) {
                removeTypingIndicator(typingId);
                appendAiMsg("*(网络抖动，智库短暂延迟)*<br><br>不过基于目前掌握的信息，我们已针对**【" + extractedData.company + "】**的痛点输出了完整的分析简报。建议您核验邮箱，我们直接发送。");
                
                if (turnCount === 0) turnCount = 1; 
                setTimeout(() => {
                    document.getElementById('chat-input-wrapper').classList.add('view-hidden');
                    document.getElementById('lead-gen-wrapper').classList.remove('view-hidden');
                    if(extractedData.email) document.getElementById('email-input').value = extractedData.email;
                }, 1000);
            }
        }

        function appendUserMsg(text) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="self-end max-w-[85%] fade-in mt-2"><div class="chat-user p-3.5 text-sm leading-relaxed">${text}</div></div>`;
            scrollToBottom();
        }

        function appendAiMsg(htmlText) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `
                <div class="flex gap-3 max-w-[95%] fade-in mt-2">
                    <div class="w-7 h-7 rounded bg-white/10 flex items-center justify-center flex-shrink-0 mt-1 border border-white/20">
                        <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
                    </div>
                    <div class="chat-ai p-3.5 text-sm text-gray-200 leading-relaxed markdown-body shadow-[0_5px_15px_rgba(0,0,0,0.5)]">${htmlText}</div>
                </div>
            `;
            lucide.createIcons();
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `
                <div id="${id}" class="flex gap-3 max-w-[80%] fade-in mt-2">
                    <div class="w-7 h-7 rounded bg-white/10 flex items-center justify-center flex-shrink-0 mt-1 border border-white/20">
                        <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
                    </div>
                    <div class="chat-ai p-3.5 text-sm flex items-center gap-1 h-12">
                        <div class="typing-indicator flex gap-1 items-center justify-center"><span></span><span></span><span></span></div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        function submitLead() {
            const finalEmail = document.getElementById('email-input').value.trim();
            if(!finalEmail) return;

            document.getElementById('step-2').classList.add('view-hidden');
            document.getElementById('step-3').classList.remove('view-hidden');
        }
    </script>
</body>
</html>
