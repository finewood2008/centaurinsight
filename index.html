<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centaur Insight | 頂級商業戰略顧問</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050505',
                        glass: 'rgba(20, 20, 20, 0.6)',
                        accent: '#4ade80',
                        accentDark: '#22c55e',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            overscroll-behavior-y: none;
        }

        .glass-card {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
        }

        .btn-glow {
            background: #ffffff;
            color: #000000;
            transition: all 0.3s ease;
        }
        .btn-glow:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .view-hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .chat-ai {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem 0.75rem 0.75rem 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .chat-user {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 0.75rem 0.75rem 0 0.75rem;
            color: #4ade80;
            font-size: 0.9rem;
        }

        .cursor-blink::after {
            content: '\25CB';
            animation: blink 1s step-start infinite;
            color: #4ade80;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .radar-box {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 1px solid rgba(74, 222, 128, 0.3);
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle, rgba(74,222,128,0.05) 0%, transparent 70%);
        }
        .radar-box::before {
            content: ''; position: absolute; inset: 0;
            background: conic-gradient(transparent 70%, rgba(74, 222, 128, 0.8) 100%);
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .log-line { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #4ade80; opacity: 0.8; margin-top: 4px; }

        .markdown-body strong { color: #4ade80; font-weight: 600; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { padding-left: 1.2rem; list-style-type: disc; margin-bottom: 0.5rem; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .reply-option-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.5rem;
            padding: 0.6rem 0.8rem;
            font-size: 0.8rem;
            text-align: left;
            color: #ccc;
            transition: all 0.2s;
            cursor: pointer;
            white-space: normal;
            word-break: break-word;
        }
        .reply-option-btn:hover { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.3); color: #4ade80; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative w-full max-w-md mx-auto">

    <header class="p-6 flex flex-col items-center justify-center shrink-0 z-50 bg-dark/90 backdrop-blur-md border-b border-white/5 relative">
        <div class="w-12 h-12 rounded-lg bg-black flex items-center justify-center mb-2 shadow-[0_0_15px_rgba(74,222,128,0.2)] border border-white/10 overflow-hidden">
            <img src="logo.png" alt="Centaur Insight Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-lg font-semibold tracking-wider">CENTAUR INSIGHT</h1>
        <p class="text-[10px] text-accent tracking-widest font-mono opacity-80 uppercase mt-1">頂級商業戰略顧問</p>
    </header>

    <!-- VIEW 1: 首頁 -->
    <main id="step-1" class="flex-grow px-6 flex flex-col justify-center fade-in z-10 pb-20">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-light mb-3 leading-tight">戰略級洞察<br><span class="font-semibold text-white">屬於少數派</span></h2>
            <p class="text-sm text-gray-400">系統將為您生成專屬商業分析報告並建立私域顧問檔案。</p>
        </div>

        <div class="space-y-6 w-full">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-accent/20 to-white/10 rounded-2xl blur opacity-25 group-focus-within:opacity-50 transition duration-500"></div>
                <input type="text" id="init-product" 
                       class="relative w-full bg-dark border border-white/20 text-white rounded-xl px-5 py-4 text-sm focus:border-accent outline-none placeholder-gray-500 shadow-inner"
                       placeholder="一句話描述您的核心業務 (如: 出海SaaS平台)"
                       oninput="checkInitInput()">
            </div>
            
            <input type="file" id="cam-card" accept="image/*" capture="environment" onchange="handleCapture()" style="display: none;">
            
            <button type="button" onclick="triggerCamera()" id="btn-card" disabled
                    class="btn-glow w-full h-14 rounded-xl flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.1)] relative z-20">
                <i data-lucide="scan-face" class="w-5 h-5"></i>
                <span class="text-sm font-semibold tracking-wide">掃描名片建立檔案</span>
            </button>
        </div>
    </main>

    <!-- VIEW 1.5: 資料抓取與辨識 -->
    <main id="step-loading" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-dark/95 backdrop-blur view-hidden">
        <div class="radar-box mb-8 shadow-[0_0_30px_rgba(74,222,128,0.2)]"></div>
        <h3 class="text-lg font-medium mb-1 tracking-widest text-accent font-mono">ESTABLISHING CONNECTION...</h3>
        
        <div id="card-result-box" class="w-[80%] max-w-xs border border-white/10 rounded-lg p-4 bg-white/5 relative overflow-hidden mb-6 opacity-0 transition-opacity duration-500">
            <div class="scan-line"></div>
            <p class="text-xs text-gray-400 font-mono mb-2">TARGET ACQUIRED</p>
            <div class="font-mono text-sm space-y-1">
                <p><span class="text-gray-500">NAME:</span> <span id="res-name" class="text-white"></span></p>
                <p><span class="text-gray-500">ROLE:</span> <span id="res-title" class="text-white"></span></p>
                <p><span class="text-gray-500">CORP:</span> <span id="res-company" class="text-white"></span></p>
            </div>
        </div>

        <div id="search-logs" class="w-[80%] max-w-xs h-24 overflow-hidden flex flex-col justify-end text-left">
        </div>
    </main>

    <!-- VIEW 2: 顧問會談 -->
    <main id="step-2" class="absolute inset-0 top-[90px] z-20 flex flex-col bg-dark view-hidden">
        <!-- 聊天內容區：選項按鈕也會嵌入此處，不會遮擋內容 -->
        <div id="chat-box" class="flex-grow p-5 overflow-y-auto flex flex-col gap-4 custom-scrollbar" style="padding-bottom: 80px;"></div>

        <!-- 底部只保留輸入框和留資模組 -->
        <div id="bottom-bar" class="sticky bottom-0 left-0 right-0 z-30 bg-dark/90 backdrop-blur-md border-t border-white/5 p-4 pt-2">

            <div id="chat-input-wrapper" class="glass-card flex items-end gap-2 p-2 relative fade-in">
                <textarea id="chat-input" rows="1" 
                          class="w-full bg-transparent text-sm text-white px-3 py-2 outline-none resize-none max-h-24 custom-scrollbar placeholder-gray-500" 
                          placeholder="手動輸入補充資訊..."
                          oninput="autoResize(this)"></textarea>
                <button onclick="sendManualMessage()" id="btn-send" class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center shrink-0 hover:bg-accent/20 transition-colors">
                    <i data-lucide="arrow-up" class="w-5 h-5 text-accent"></i>
                </button>
            </div>

            <div id="lead-gen-wrapper" class="glass-card p-5 view-hidden fade-in border-red-500/30 shadow-[0_0_30px_rgba(239,68,68,0.1)] relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-500 to-orange-500"></div>
                <p class="text-[11px] text-red-400 font-mono mb-1 text-center font-bold tracking-widest">[ SYSTEM ALERT ]</p>
                <p class="text-sm font-semibold text-white text-center mb-4">核心痛點已鎖定，正在生成萬字深度研報</p>
                
                <div class="flex flex-col gap-3">
                    <input type="email" id="email-input" class="w-full bg-black/50 border border-white/20 text-white text-sm rounded-lg px-4 py-3 outline-none focus:border-red-400" placeholder="接收報告的電子郵件">
                    
                    <div class="flex items-center gap-3 bg-white/5 p-3 rounded-lg border border-white/10">
                        <div class="w-12 h-12 bg-white rounded flex items-center justify-center shrink-0">
                            <i data-lucide="qr-code" class="w-8 h-8 text-black"></i>
                        </div>
                        <div class="flex-grow">
                            <p class="text-xs text-gray-300">添加專屬人類顧問微信</p>
                            <p class="text-sm font-bold text-white">獲取報告解密密碼</p>
                        </div>
                    </div>

                    <button onclick="submitLead()" class="w-full py-3 rounded-lg bg-white text-black font-bold text-sm hover:bg-gray-200 mt-2">
                        確認接收並建檔
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- VIEW 3: 成功頁 -->
    <div id="step-3" class="absolute inset-0 z-50 flex items-center justify-center bg-dark view-hidden">
        <div class="text-center fade-in px-6">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 bg-accent/20 rounded-full animate-ping"></div>
                <div class="relative w-full h-full rounded-full border-2 border-accent flex items-center justify-center bg-dark">
                    <i data-lucide="check" class="w-8 h-8 text-accent"></i>
                </div>
            </div>
            <h2 class="text-2xl font-light mb-3">研報生成中...</h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8">
                您的專屬商業分析報告已進入計算隊列<br>請留意您的郵箱及微信通知。
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const PROXY_URL = "https://gemini-proxy.finewood2008.workers.dev";
        
        let extractedData = { name: "貴賓", title: "負責人", company: "貴司", email: "" };
        let businessDesc = "";
        let chatHistory = [];
        let turnCount = 0;

        const SEARCH_LOGS = [
            "Initializing deep web crawler...",
            "Scanning industry database for {company}...",
            "Analyzing competitors data points...",
            "Cross-referencing {business} market trends...",
            "Extracting sentiment from recent news...",
            "Compiling strategic matrix..."
        ];

        const PROMPT_SYS = "你是一名身價千萬的頂尖AI商業戰略顧問。\n客戶公司：【{company}】\n客戶身份：【{honorific}】\n核心業務：【{business}】\n\n要求：\n1. 第一輪回覆：基於他的業務和公司，給出一份約300字的【深度市場破冰洞察】，必須犀利指出行業痛點，展現出極高的專業度。\n2. 格式要求：使用Markdown排版，重點加粗。\n3. 選項機制（核心）：在你的回覆結尾，【必須】提供3個深入探討的選項，用來引導用戶。選項格式嚴格如下（每行一個，必須以"選項X: "開頭）：\n選項1: [提問或探討方向1]\n選項2: [提問或探討方向2]\n選項3: [提問或探討方向3]";

        const PROMPT_TURN = "(System Note: 請針對客戶的回答進行犀利分析，並在結尾嚴格按照'選項1: ...'的格式給出3個追問選項。回覆語言請嚴格使用繁體中文。)";

        const PROMPT_END = "(System Note: 客戶已經透露核心痛點。此次回覆不要再給選項。請簡短回覆一句：'我已經鎖定了您業務的致命卡點與增長槓桿，系統正在為您生成萬字級深度研報...' 回覆語言請嚴格使用繁體中文。)";

        function checkInitInput() {
            const val = document.getElementById('init-product').value.trim();
            const btn = document.getElementById('btn-card');
            if (val.length === 0) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('btn-glow');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('btn-glow');
            }
        }

        function triggerCamera() { 
            document.getElementById('cam-card').click(); 
        }

        function compressImage(file, maxWidth = 600) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6).split(',')[1]); 
                    };
                    img.onerror = reject;
                };
            });
        }

        async function handleCapture() {
            const fileInput = document.getElementById('cam-card');
            if(fileInput.files && fileInput.files[0]) {
                businessDesc = document.getElementById('init-product').value.trim();
                document.getElementById('step-1').classList.add('view-hidden');
                document.getElementById('step-loading').classList.remove('view-hidden');

                try {
                    const file = fileInput.files[0];
                    const base64Data = await compressImage(file);
                    await extractCardInfo(base64Data);
                } catch (e) {
                    console.error("OCR Failed", e);
                    simulateSearchAndStart(); 
                }
            }
        }

        async function extractCardInfo(base64Data) {
            const reqBody = {
                contents: [{ parts: [
                    { text: '精準提取名片資訊並返回JSON：{"name": "姓名", "title": "職位", "company": "公司", "email": "郵箱"}' },
                    { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                ]}]
            };
            try {
                const res = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(reqBody) });
                const data = await res.json();
                let aiText = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
                const parsed = JSON.parse(aiText);
                if (parsed.name) extractedData.name = parsed.name.split(' ')[0]; 
                if (parsed.title) extractedData.title = parsed.title;
                if (parsed.company) extractedData.company = parsed.company;
                if (parsed.email) extractedData.email = parsed.email;
            } catch (err) { console.log("OCR err", err); }
            simulateSearchAndStart();
        }

        async function simulateSearchAndStart() {
            document.getElementById('res-name').innerText = extractedData.name;
            document.getElementById('res-title').innerText = extractedData.title;
            document.getElementById('res-company').innerText = extractedData.company;
            document.getElementById('card-result-box').style.opacity = 1;

            const logContainer = document.getElementById('search-logs');
            
            for (let i = 0; i < SEARCH_LOGS.length; i++) {
                await new Promise(r => setTimeout(r, 600));
                const text = SEARCH_LOGS[i].replace('{company}', extractedData.company).replace('{business}', businessDesc);
                logContainer.innerHTML += '<div class="log-line fade-in">> ' + text + '</div>';
            }
            
            await new Promise(r => setTimeout(r, 1000));
            startChat();
        }

        function startChat() {
            document.getElementById('step-loading').classList.add('view-hidden');
            document.getElementById('step-2').classList.remove('view-hidden');

            const isKnown = extractedData.company !== "貴司";
            const honorific = isKnown && extractedData.name !== "貴賓" ? ("**" + extractedData.name + "** " + extractedData.title) : "貴賓";

            const SYSTEM_PROMPT = PROMPT_SYS.replace('{company}', extractedData.company).replace('{honorific}', honorific).replace('{business}', businessDesc);

            chatHistory = [{ role: "user", parts: [{ text: SYSTEM_PROMPT }] }];
            fetchAIResponse(SYSTEM_PROMPT, true);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function sendOptionMessage(text) {
            removeInlineOptions();
            document.getElementById('chat-input').value = '';
            appendUserMsg(text);
            handleTurn(text);
        }

        function sendManualMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = ''; inputEl.style.height = 'auto';
            removeInlineOptions();
            appendUserMsg(text);
            handleTurn(text);
        }

        function removeInlineOptions() {
            var existing = document.getElementById('inline-options');
            if (existing) existing.remove();
        }

        // 將選項按鈕嵌入聊天流中（不再使用懸浮底部）
        function appendInlineOptions(options) {
            removeInlineOptions();
            var chatBox = document.getElementById('chat-box');
            var wrapper = document.createElement('div');
            wrapper.id = 'inline-options';
            wrapper.className = 'flex flex-col gap-2 fade-in mt-2 mb-2';
            options.forEach(function(opt) {
                var btn = document.createElement('button');
                btn.className = 'reply-option-btn';
                btn.textContent = opt;
                btn.onclick = function() { sendOptionMessage(opt); };
                wrapper.appendChild(btn);
            });
            chatBox.appendChild(wrapper);
            scrollToBottom();
        }

        async function handleTurn(userText) {
            turnCount++;
            let promptToSend = userText;

            if (turnCount >= 2) {
                promptToSend += "\n\n" + PROMPT_END;
            } else {
                promptToSend += "\n\n" + PROMPT_TURN;
            }

            await fetchAIResponse(promptToSend, false);
            
            if (turnCount >= 2) {
                setTimeout(function() {
                    document.getElementById('chat-input-wrapper').classList.add('view-hidden');
                    document.getElementById('lead-gen-wrapper').classList.remove('view-hidden');
                    if(extractedData.email) document.getElementById('email-input').value = extractedData.email;
                    scrollToBottom();
                }, 1000);
            }
        }

        async function fetchAIResponse(userText, isFirst) {
            if(!isFirst) chatHistory.push({ role: "user", parts: [{ text: userText }] });
            
            const msgId = 'ai-msg-' + Date.now();
            appendAiBox(msgId);
            const contentBox = document.getElementById(msgId);
            contentBox.innerHTML = '<div class="typing-indicator flex gap-1 items-center h-5"><span></span><span></span><span></span></div>';
            scrollToBottom();

            try {
                const res = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });
                if (!res.ok) throw new Error("Net Err");
                const data = await res.json();
                let aiText = data.candidates[0].content.parts[0].text;
                
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                
                let mainText = aiText;
                let options = [];
                const optionRegex = /選項\d:\s*(.*)/g;
                let match;
                while ((match = optionRegex.exec(aiText)) !== null) {
                    options.push(match[1]);
                }
                mainText = aiText.replace(/選項\d:\s*(.*)/g, "").trim();

                await typeWriterEffect(contentBox, mainText);

                // 選項嵌入聊天流中
                if (options.length > 0 && turnCount < 2) {
                    appendInlineOptions(options);
                }

            } catch (err) {
                console.log(err);
                contentBox.innerHTML = marked.parse("*(網路波動，連線中斷)*<br>但您的核心訴求已接收。分析研報生成中...");
                if (turnCount < 2) {
                    turnCount = 2;
                    setTimeout(function() {
                        document.getElementById('chat-input-wrapper').classList.add('view-hidden');
                        document.getElementById('lead-gen-wrapper').classList.remove('view-hidden');
                    }, 1000);
                }
            }
        }

        async function typeWriterEffect(element, fullMarkdown) {
            element.innerHTML = '';
            element.classList.add('cursor-blink');
            
            let currentText = "";
            const chars = fullMarkdown.split('');
            
            for (let i = 0; i < chars.length; i++) {
                currentText += chars[i];
                element.innerHTML = marked.parse(currentText);
                scrollToBottom();
                
                let delay = 15;
                if (['，', ',', '。', '.', '！', '!', '？', '?'].indexOf(chars[i]) !== -1) delay = 150;
                if (chars[i] === '\n') delay = 200;
                
                await new Promise(function(r) { setTimeout(r, delay); });
            }
            element.classList.remove('cursor-blink');
            lucide.createIcons();
        }

        function appendUserMsg(text) {
            const chatBox = document.getElementById('chat-box');
            const wrapper = document.createElement('div');
            wrapper.className = 'self-end max-w-[85%] fade-in mt-2';
            const bubble = document.createElement('div');
            bubble.className = 'chat-user p-3.5';
            bubble.textContent = text;
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            scrollToBottom();
        }

        function appendAiBox(id) {
            const chatBox = document.getElementById('chat-box');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex gap-3 max-w-[95%] fade-in mt-2';
            wrapper.innerHTML = '<div class="w-7 h-7 rounded bg-white/10 flex items-center justify-center flex-shrink-0 mt-1 border border-white/20"><i data-lucide="cpu" class="w-4 h-4 text-white"></i></div><div id="' + id + '" class="chat-ai p-4 markdown-body shadow-[0_5px_15px_rgba(0,0,0,0.5)] flex-grow"></div>';
            chatBox.appendChild(wrapper);
            lucide.createIcons();
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        async function submitLead() {
            const email = document.getElementById('email-input').value.trim();
            if(!email) return alert(i18n[currentLang].emailPlaceholder || "请留下接收报告的邮箱");
            
            document.getElementById('step-2').classList.add('view-hidden');
            document.getElementById('step-3').classList.remove('view-hidden');

            // 整理需要发送到后台的数据
            const payload = {
                name: extractedData.name,
                title: extractedData.title,
                company: extractedData.company,
                email: email,
                business: businessDesc,
                chatHistory: chatHistory.map(msg => `${msg.role === 'user' ? '客户' : '顾问'}: ${msg.parts[0].text}`)
            };

            try {
                // 这里替换为你接下来部署的 Cloudflare Worker 地址
                const WORKER_URL = "https://centaur-lead.finewood2008.workers.dev"; 
                fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(e => console.log("静默提交失败", e));
            } catch (err) {
                console.error("提交出错", err);
            }
        }

        // typing indicator animation
        const style = document.createElement('style');
        style.innerHTML = '.typing-indicator span { display: inline-block; width: 4px; height: 4px; background-color: #4ade80; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; } .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; } @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }';
        document.head.appendChild(style);
    </script>
</body>
</html>
