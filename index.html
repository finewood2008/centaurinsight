<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centaur Insight | 专属战略推演 (AI 驱动)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050505',
                        glass: 'rgba(20, 20, 20, 0.6)',
                        accent: '#4ade80',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            overscroll-behavior-y: none;
        }

        .glass-card {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
        }

        .btn-glow {
            background: #ffffff;
            color: #000000;
            transition: all 0.3s ease;
        }
        .btn-glow:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        .view-hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-ai {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem 0.75rem 0.75rem 0;
        }
        .chat-user {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 0.75rem 0.75rem 0 0.75rem;
            color: #4ade80;
        }

        .typing-indicator span {
            display: inline-block;
            width: 4px; height: 4px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Markdown 样式 */
        .markdown-body strong { color: #4ade80; font-weight: 600; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative w-full max-w-md mx-auto">

    <!-- Header -->
    <header class="p-6 flex flex-col items-center justify-center shrink-0 z-50 bg-dark/80 backdrop-blur-md">
        <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center mb-2 shadow-[0_0_15px_rgba(255,255,255,0.2)]">
            <i data-lucide="layers" class="w-6 h-6 text-black"></i>
        </div>
        <h1 class="text-lg font-semibold tracking-wider">CENTAUR INSIGHT</h1>
        <p class="text-[10px] text-accent tracking-widest font-mono opacity-80 uppercase mt-1">Deep AI Consultant</p>
    </header>

    <!-- 步骤 1：输入产品钩子 -->
    <main id="step-1" class="flex-grow px-6 flex flex-col justify-center fade-in z-10 pb-20">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-light mb-3 leading-tight">输入核心产品<br><span class="font-semibold text-white">开启深度洞察</span></h2>
            <p class="text-sm text-gray-400">我们将调用顶尖商业模型为您进行实时诊断</p>
        </div>

        <div class="space-y-6 w-full">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-accent/20 to-white/10 rounded-2xl blur opacity-25 group-focus-within:opacity-50 transition duration-500"></div>
                <input type="text" id="init-product" 
                       class="relative w-full bg-dark border border-white/20 text-white rounded-xl px-5 py-4 text-base focus:border-accent outline-none placeholder-gray-500 shadow-inner"
                       placeholder="例如：户外电源 / 智能手表 / 注塑机"
                       oninput="checkInitInput()">
            </div>
            
            <button id="btn-start" disabled onclick="startConsultation()" 
                    class="btn-glow w-full rounded-xl py-4 font-semibold tracking-wide text-sm flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                <i data-lucide="zap" class="w-4 h-4"></i>
                连线 AI 战略顾问
            </button>
        </div>
    </main>

    <!-- 步骤 2：互动推演界面 -->
    <main id="step-2" class="absolute inset-0 top-[110px] z-20 flex flex-col bg-dark view-hidden">
        <!-- 聊天区域 -->
        <div id="chat-box" class="flex-grow p-5 overflow-y-auto flex flex-col gap-5 pb-28 custom-scrollbar">
            <!-- 动态消息会插入这里 -->
        </div>

        <!-- 底部输入区域 -->
        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-dark via-dark to-transparent z-30">
            <div id="chat-input-wrapper" class="glass-card flex items-end gap-2 p-2 relative fade-in">
                <textarea id="chat-input" rows="1" 
                          class="w-full bg-transparent text-sm text-white px-3 py-2 outline-none resize-none max-h-24 custom-scrollbar placeholder-gray-500" 
                          placeholder="输入您的回答或痛点..."
                          oninput="autoResize(this)"></textarea>
                <button onclick="sendMessage()" id="btn-send" class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center shrink-0 hover:bg-accent/20 transition-colors">
                    <i data-lucide="arrow-up" class="w-5 h-5 text-accent"></i>
                </button>
            </div>

            <!-- 收网留资表单 (默认隐藏) -->
            <div id="lead-gen-wrapper" class="glass-card p-4 view-hidden fade-in border-accent/30 shadow-[0_0_30px_rgba(74,222,128,0.1)]">
                <p class="text-xs text-accent font-mono mb-3 text-center">◆ 完整战略报告已生成，请输入邮箱接收 ◆</p>
                <div class="flex gap-2">
                    <input type="email" id="email-input" class="flex-grow bg-white/5 border border-white/20 text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:border-accent" placeholder="您的企业邮箱">
                    <button onclick="submitLead()" class="px-5 rounded-lg bg-accent text-black font-semibold text-sm hover:bg-green-300">
                        接收报告
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 步骤 3：成功页面 -->
    <div id="step-3" class="absolute inset-0 z-50 flex items-center justify-center bg-dark view-hidden">
        <div class="text-center fade-in px-6">
            <div class="relative w-20 h-20 mx-auto mb-6">
                <div class="absolute inset-0 bg-accent/20 rounded-full animate-ping"></div>
                <div class="relative w-full h-full rounded-full border-2 border-accent flex items-center justify-center bg-dark">
                    <i data-lucide="send" class="w-8 h-8 text-accent ml-1"></i>
                </div>
            </div>
            <h2 class="text-2xl font-light mb-3">报告已投递</h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8">
                高级战略研究员将在深度校验后<br>将报告发送至您的邮箱。
            </p>
            <button onclick="location.reload()" class="text-xs text-gray-500 tracking-widest font-mono uppercase hover:text-white transition-colors">
                [ 返回首页 ]
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const PROXY_URL = "https://gemini-proxy.finewood2008.workers.dev";
        let productName = "";
        let turnCount = 0; // 记录对话轮数，用于触发留资

        // 大模型的高级人设
        const SYSTEM_PROMPT = `你是一个名为 Centaur Insight 的全球顶尖商业战略顾问 AI（说话风格类似麦肯锡资深合伙人）。你目前正在一个高端行业展会现场与潜在B端客户对话。

你的终极目标是：通过短短 2-3 轮极具深度的对话，用专业度和行业洞察给客户带来“Wow Moment”（震撼感），并最终引诱客户留下邮箱以获取你为其“定制的深度报告”。

【核心沟通原则】：
1. 绝对犀利，一针见血。拒绝任何泛泛而谈的废话、“正确的废话”和AI味道浓重的套话（如“这是一个很好的问题”）。
2. 使用高度专业的商业词汇（视用户产品而定，如：出海溢价、同质化内卷、第二增长曲线、LTV、供应链护城河、B端采购决策链等）。
3. 字数严格克制：每次回复必须在 100-150 字以内（非常重要，因为是手机端阅读）。
4. 排版精美：多用短句，关键点用加粗，无需列过多的列表。

【对话剧本（严格执行）】：
- 用户的第一次输入会是他们的产品或行业。
- 你的第一次回复（Round 1）：针对该产品立刻抛出一个极其犀利、可能带有“逆向思维”的市场洞察（说明这个赛道现在有多惨烈或有什么隐秘机会），然后**立刻反问一个直击灵魂的业务痛点问题**（例如：你们现在是靠价格战苟延残喘，还是在谋求品牌溢价？）。
- 你的第二次回复（Round 2）：根据用户的回答，给出一个**极具含金量、让人眼前一亮的破局思路或者实操方向**（Wow Moment）。然后，**立即停止免费建议，开始收网**。
- 收网话术示例：“现场演示时间有限。我已经基于你的痛点，系统性地生成了一份《[该行业]北美/全球大客户精准破局战略》15页深度报告及实操清单。请留下您的企业邮箱，我会立刻发送给您。”
`;

        let chatHistory = [
            {
                role: "user",
                parts: [{ text: SYSTEM_PROMPT }]
            },
            {
                role: "model",
                parts: [{ text: "收到。我将严格扮演顶尖商业顾问，通过犀利洞察和简短有力的反问掌控对话节奏，并在第二轮互动后引导用户留下邮箱提取报告。" }]
            }
        ];

        function checkInitInput() {
            const val = document.getElementById('init-product').value.trim();
            const btn = document.getElementById('btn-start');
            btn.disabled = val.length === 0;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        async function startConsultation() {
            productName = document.getElementById('init-product').value.trim();
            if (!productName) return;

            document.getElementById('step-1').classList.add('view-hidden');
            document.getElementById('step-2').classList.remove('view-hidden');

            const initialMsg = `我的核心产品/行业是：【${productName}】`;
            appendUserMsg(initialMsg);
            
            // 首次请求大模型
            await fetchAIResponse(initialMsg);
        }

        async function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            appendUserMsg(text);

            turnCount++;

            // 如果到了收网环节（turnCount >= 1 代表用户已经回答了第一个问题）
            // 我们可以在发给 AI 的内容后暗中加一条指令，确保大模型收网
            let promptToSend = text;
            if (turnCount >= 1) {
                promptToSend += "\n\n(System Note: 请在本次回复中给出核心价值点后，立刻告知深度报告已生成，要求客户留下邮箱，且不要再提问新问题。)";
            }

            await fetchAIResponse(promptToSend);
            
            // 在第二次 AI 回复后，显示留资框
            if (turnCount >= 1) {
                setTimeout(() => {
                    document.getElementById('chat-input-wrapper').classList.add('view-hidden');
                    document.getElementById('lead-gen-wrapper').classList.remove('view-hidden');
                    document.getElementById('chat-box').style.paddingBottom = "120px";
                    
                    // 滚动到底部
                    const chatBox = document.getElementById('chat-box');
                    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
                }, 2000); // 延迟展示留资，给用户阅读时间
            }
        }

        async function fetchAIResponse(userText) {
            // 加入历史记录
            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            const typingId = showTypingIndicator();

            try {
                // 调用 Gemini (使用 1.5 pro 或 flash 均可，通过 proxy 转发)
                // 这里的 request 结构匹配 Gemini API
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }

                const data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                
                // 把模型回复加入历史
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });

                removeTypingIndicator(typingId);
                appendAiMsg(marked.parse(aiText));

            } catch (error) {
                console.error("AI Error:", error);
                removeTypingIndicator(typingId);
                appendAiMsg("*(网络抖动，智库连接中断)*<br><br>不过，我们针对【" + productName + "】已有极具价值的行业调研模型。建议您留下邮箱，稍后为您直接发送深度分析简报。");
                
                // 如果出错，强制进入留资
                if (turnCount === 0) turnCount = 1; 
                setTimeout(() => {
                    document.getElementById('chat-input-wrapper').classList.add('view-hidden');
                    document.getElementById('lead-gen-wrapper').classList.remove('view-hidden');
                }, 1000);
            }
        }

        // ================= UI 渲染逻辑 =================

        function appendUserMsg(text) {
            const chatBox = document.getElementById('chat-box');
            const wrap = document.createElement('div');
            wrap.className = "self-end max-w-[85%] fade-in";
            wrap.innerHTML = `<div class="chat-user p-3.5 text-sm leading-relaxed">${text}</div>`;
            chatBox.appendChild(wrap);
            scrollToBottom();
        }

        function appendAiMsg(htmlText) {
            const chatBox = document.getElementById('chat-box');
            const wrap = document.createElement('div');
            wrap.className = "flex gap-3 max-w-[95%] fade-in";
            wrap.innerHTML = `
                <div class="w-7 h-7 rounded bg-white/10 flex items-center justify-center flex-shrink-0 mt-1 border border-white/20">
                    <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
                </div>
                <div class="chat-ai p-3.5 text-sm text-gray-200 leading-relaxed markdown-body shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
                    ${htmlText}
                </div>
            `;
            chatBox.appendChild(wrap);
            lucide.createIcons();
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const chatBox = document.getElementById('chat-box');
            const wrap = document.createElement('div');
            wrap.id = id;
            wrap.className = "flex gap-3 max-w-[80%] fade-in";
            wrap.innerHTML = `
                <div class="w-7 h-7 rounded bg-white/10 flex items-center justify-center flex-shrink-0 mt-1 border border-white/20">
                    <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
                </div>
                <div class="chat-ai p-3.5 text-sm flex items-center gap-1 h-12">
                    <div class="typing-indicator flex gap-1 items-center justify-center">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatBox.appendChild(wrap);
            lucide.createIcons();
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        function submitLead() {
            const email = document.getElementById('email-input').value.trim();
            if(!email) return;

            // 这里可以接入真实的 webhook 发送数据
            console.log("Collected Lead:", { product: productName, email: email, chat: chatHistory });

            document.getElementById('step-2').classList.add('view-hidden');
            document.getElementById('step-3').classList.remove('view-hidden');
        }
    </script>
</body>
</html>
