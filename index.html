<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centaur Insight | 展会专属战略诊断 (AI 驱动版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050505',
                        glass: 'rgba(20, 20, 20, 0.6)',
                        accent: '#4ade80',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            overscroll-behavior-y: none;
        }
        
        input[type="file"] { display: none; }

        .glass-card {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
        }

        .camera-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .camera-btn img.preview-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            z-index: 0;
        }
        .camera-btn:active { transform: scale(0.98); }
        .camera-btn.captured {
            background: rgba(74, 222, 128, 0.05);
            border-color: rgba(74, 222, 128, 0.4);
            border-style: solid;
        }

        .btn-glow {
            background: #ffffff;
            color: #000000;
            transition: all 0.3s ease;
        }
        .btn-glow:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }

        .view-hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-ai {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem 0.75rem 0.75rem 0;
        }
        .chat-user {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 0.75rem 0.75rem 0 0.75rem;
            color: #4ade80;
        }

        .typing-cursor::after {
            content: '█';
            animation: blink 1s step-start infinite;
            color: #4ade80;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .radar-box {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 1px solid rgba(74, 222, 128, 0.3);
            position: relative;
            overflow: hidden;
        }
        .radar-box::before {
            content: ''; position: absolute; inset: 0;
            background: conic-gradient(transparent 70%, rgba(74, 222, 128, 0.8) 100%);
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Markdown 解析后的排版样式 */
        .markdown-body strong { color: #4ade80; font-weight: 600; }
        .markdown-body p { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative w-full max-w-md mx-auto">

    <!-- Header -->
    <header class="p-6 flex flex-col items-center justify-center">
        <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center mb-2">
            <i data-lucide="layers" class="w-6 h-6 text-black"></i>
        </div>
        <h1 class="text-lg font-semibold tracking-wider">CENTAUR INSIGHT</h1>
        <p class="text-[10px] text-accent tracking-widest font-mono opacity-80 uppercase mt-1">DeepResearch Engine</p>
    </header>

    <!-- 步骤 1：录入 -->
    <main id="step-1" class="flex-grow px-5 flex flex-col fade-in z-10">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-light mb-2">定制您的<span class="font-semibold text-white">出海战略</span></h2>
            <p class="text-sm text-gray-400">请录入两项基础信息以启动 AI 推演</p>
        </div>

        <div class="space-y-4">
            <input type="file" id="cam-product" accept="image/*" capture="environment" onchange="handleCapture('product')">
            <button type="button" onclick="document.getElementById('cam-product').click()" id="btn-product"
                    class="camera-btn w-full h-28 rounded-2xl flex flex-col items-center justify-center gap-2">
                <i data-lucide="scan-line" class="w-6 h-6 text-gray-300 icon-ph z-10"></i>
                <span class="text-sm text-gray-300 font-medium text-ph z-10">1. 拍一张产品宣传页</span>
            </button>

            <input type="file" id="cam-card" accept="image/*" capture="environment" onchange="handleCapture('card')">
            <button type="button" onclick="document.getElementById('cam-card').click()" id="btn-card"
                    class="camera-btn w-full h-28 rounded-2xl flex flex-col items-center justify-center gap-2">
                <i data-lucide="contact" class="w-6 h-6 text-gray-300 icon-ph z-10"></i>
                <span class="text-sm text-gray-300 font-medium text-ph z-10">2. 拍一张您的名片</span>
            </button>
        </div>

        <div class="mt-8">
            <button id="btn-start" disabled onclick="startProcessing()" 
                    class="btn-glow w-full rounded-xl py-4 font-semibold tracking-wide text-sm flex items-center justify-center gap-2">
                <i data-lucide="cpu" class="w-4 h-4"></i>
                初始化战略引擎
            </button>
        </div>
    </main>

    <!-- 步骤 2：雷达处理过渡 -->
    <main id="step-2" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-dark view-hidden">
        <div class="radar-box mb-8"></div>
        <h3 class="text-xl font-medium mb-3 tracking-widest text-accent font-mono">VISION API ONLINE</h3>
        <p id="process-text" class="text-sm text-gray-400 font-mono text-center h-6 px-4">正在连接 Google Gemini 模型提取图文特征...</p>
    </main>

    <!-- 步骤 3：AI 对话 -->
    <main id="step-3" class="absolute inset-0 z-30 flex flex-col bg-dark view-hidden">
        <div class="px-5 py-4 border-b border-white/10 glass-card rounded-none flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-accent/20 border border-accent/50 flex items-center justify-center">
                <i data-lucide="bot" class="w-4 h-4 text-accent"></i>
            </div>
            <div>
                <div class="text-sm font-medium">Centaur AI Agent</div>
                <div class="text-[10px] text-accent font-mono">● Gemini 1.5 Pro Vision Active</div>
            </div>
        </div>

        <div id="chat-box" class="flex-grow p-5 overflow-y-auto flex flex-col gap-5 pb-24"></div>

        <div id="chat-actions" class="p-5 border-t border-white/10 bg-black/80 backdrop-blur pb-8 view-hidden">
            <div id="action-confirm-summary" class="flex gap-3 view-hidden fade-in">
                <button onclick="userReplySummary(false)" class="flex-1 py-3 rounded-lg border border-white/20 text-sm text-gray-300 hover:bg-white/5">
                    不够准确
                </button>
                <button onclick="userReplySummary(true)" class="flex-[2] py-3 rounded-lg bg-accent text-black font-medium text-sm">
                    没错，非常准确
                </button>
            </div>

            <div id="action-confirm-email" class="view-hidden fade-in space-y-3">
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-3.5 w-4 h-4 text-gray-500"></i>
                    <input type="email" id="email-input" 
                        class="w-full bg-white/5 border border-white/20 text-white rounded-lg pl-10 pr-4 py-3 text-sm focus:border-accent outline-none">
                </div>
                <button onclick="finishProcess()" id="btn-final-send" class="w-full bg-white text-black py-3 rounded-lg font-medium text-sm flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> 生成并发送深度研报
                </button>
            </div>
        </div>
    </main>

    <!-- 成功画面 -->
    <div id="step-4" class="absolute inset-0 z-50 flex items-center justify-center bg-dark view-hidden">
        <div class="text-center fade-in px-6">
            <div class="w-16 h-16 rounded-full bg-accent/20 flex items-center justify-center mx-auto mb-6 border border-accent">
                <i data-lucide="check-check" class="w-8 h-8 text-accent"></i>
            </div>
            <h2 class="text-2xl font-light mb-3" id="final-title">研报投递中</h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8" id="final-desc">
                您的专属出海战略已封装完毕，<br>正在通过企业服务器发送至您的邮箱。
            </p>
            <button onclick="location.reload()" class="text-xs text-gray-600 underline font-mono">
                [ 重置演示 ]
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 不需要在这里明文写 API Key 了，因为请求会走我们自己的 Cloudflare 代理节点
        // 这样既解决了国内网络连通性问题，又保证了 API Key 的安全
        const PROXY_URL = "https://gemini-proxy.finewood2008.workers.dev";
        
        let state = { product: null, card: null }; // 存储图片的 Base64 数据
        let aiExtractedData = {
            name: "贵宾",
            email: "",
            productDesc: ""
        };

        // 将大尺寸图片压缩后再转Base64，避免Payload过大导致API报错
        function compressImage(file, maxWidth = 1000) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 输出压缩后的 JPEG Base64
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        resolve(dataUrl.split(',')[1]); 
                    };
                    img.onerror = (e) => reject(e);
                };
            });
        }

        async function handleCapture(type) {
            const fileInput = document.getElementById(`cam-${type}`);
            if(fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                
                // 使用压缩算法代替之前的 FileReader
                const base64Data = await compressImage(file);
                state[type] = {
                    mimeType: 'image/jpeg', // 强制指定格式，避免解析出错
                    data: base64Data
                };

                const btn = document.getElementById(`btn-${type}`);
                btn.classList.add('captured');
                // 添加缩略图作为背景
                const reader = new FileReader();
                reader.onload = function(e) {
                    btn.innerHTML = `
                        <img src="${e.target.result}" class="preview-img">
                        <div class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center mb-1 z-10 border border-accent/50">
                            <i data-lucide="check" class="w-5 h-5 text-accent"></i>
                        </div>
                        <span class="text-sm text-accent font-medium z-10 shadow-black drop-shadow-md">${type === 'product' ? '宣传页' : '名片'}已采集</span>
                    `;
                    lucide.createIcons();
                }
                reader.readAsDataURL(file);
                
                if(state.product && state.card) {
                    const startBtn = document.getElementById('btn-start');
                    startBtn.disabled = false;
                    startBtn.classList.add('animate-bounce');
                    setTimeout(() => startBtn.classList.remove('animate-bounce'), 1000);
                }
            }
        }

        // 真实调用 Gemini API 进行多模态提取
        async function startProcessing() {
            document.getElementById('step-1').classList.add('view-hidden');
            document.getElementById('step-2').classList.remove('view-hidden');
            
            const el = document.getElementById('process-text');
            el.innerText = "正在将图像传输至 Gemini 1.5 视觉引擎...";

            // 构造请求体 (调用 Gemini 1.5 Pro，因为它多模态强)
            const requestBody = {
                contents: [{
                    parts: [
                        { text: "你是一个专业的出海战略顾问。请提取这两张图片的信息：第一张通常是产品介绍，第二张是名片。请严格返回一个 JSON 格式，不要包含其他任何标记代码。包含以下字段：1. name (名片上的名字或者姓氏，如果没有则为'老板')。 2. email (名片上的邮箱，如果没有则留空)。 3. product_summary (用100字左右总结这个产品的核心竞争力和材质，并推测它适合欧美高端市场还是新兴市场，语气要像麦肯锡顾问般专业、简练)。" },
                        { inlineData: { mimeType: state.product.mimeType, data: state.product.data } },
                        { inlineData: { mimeType: state.card.mimeType, data: state.card.data } }
                    ]
                }]
            };

            try {
                el.innerText = "等待 AI 解析名片与产品基因...";
                
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                // 新增：如果 HTTP 状态码不是 200，直接抛出错误信息方便调试
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    let aiText = data.candidates[0].content.parts[0].text;
                    // 清理 markdown 代码块格式 ```json ... ```
                    aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
                    
                    const parsedData = JSON.parse(aiText);
                    aiExtractedData.name = parsedData.name || "老板";
                    aiExtractedData.email = parsedData.email || "";
                    aiExtractedData.productDesc = parsedData.product_summary || "这是一项具备出海潜力的优质制造产品。";
                    
                    startChat();
                } else {
                    throw new Error("模型未返回有效内容: " + JSON.stringify(data));
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                // 把真实的报错原因打印在屏幕上
                el.innerHTML = `<span style="color: #ef4444;">API 解析失败：${error.message.substring(0, 100)}...</span><br>正在降级为兜底模式...`;
                setTimeout(startChat, 3000); 
            }
        }

        // 步骤 3：AI 聊天
        function startChat() {
            document.getElementById('step-2').classList.add('view-hidden');
            document.getElementById('step-3').classList.remove('view-hidden');
            
            // 使用 Gemini 解析出来的真实数据作为开场白
            const opening = `你好，**${aiExtractedData.name}**。我已经通过视觉模型扫描了您的资料。<br><br>关于您的产品，我的初步推演结论如下：<br><br>${aiExtractedData.productDesc}<br><br>请问这个产品基因总结准确吗？`;
            
            appendAiMsg(marked.parse(opening), () => {
                document.getElementById('chat-actions').classList.remove('view-hidden');
                document.getElementById('action-confirm-summary').classList.remove('view-hidden');
            });
        }

        function appendAiMsg(htmlText, callback) {
            const chatBox = document.getElementById('chat-box');
            const wrap = document.createElement('div');
            wrap.className = "flex gap-3 max-w-[90%] fade-in";
            wrap.innerHTML = `
                <div class="w-6 h-6 rounded bg-white/10 flex items-center justify-center flex-shrink-0 mt-1">
                    <i data-lucide="cpu" class="w-3 h-3 text-white"></i>
                </div>
                <div class="chat-ai p-3.5 text-sm text-gray-200 leading-relaxed markdown-body">
                    ${htmlText}
                </div>
            `;
            chatBox.appendChild(wrap);
            lucide.createIcons();
            chatBox.scrollTop = chatBox.scrollHeight;

            // 简单模拟打字耗时再弹按钮
            setTimeout(() => { if(callback) callback(); }, 1000); 
        }

        function appendUserMsg(text) {
            const chatBox = document.getElementById('chat-box');
            const wrap = document.createElement('div');
            wrap.className = "self-end max-w-[85%] fade-in mt-2";
            wrap.innerHTML = `<div class="chat-user p-3.5 text-sm">${text}</div>`;
            chatBox.appendChild(wrap);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function userReplySummary(isCorrect) {
            document.getElementById('action-confirm-summary').classList.add('view-hidden');
            appendUserMsg(isCorrect ? "没错，非常准确。" : "基本是这样，但还需要微调。");
            
            setTimeout(() => {
                const followUp = isCorrect ? 
                    "精准的定位是实现品牌溢价的第一步。" : 
                    "收到。深度研报生成时，我会调取更多的海外行业研报来交叉比对校准。";
                
                const askEmail = `${followUp}<br><br>目前，后台算力已锁定了您的产品类别，即将生成包含 **竞品底牌定价** 与 **蓝海切入路径** 的完整出海战略研报。<br><br>我们将把这份涉密研报发送至您的邮箱：**${aiExtractedData.email ? aiExtractedData.email : '[请在下方补充邮箱]'}**。<br>请确认接收地址。`;
                
                appendAiMsg(marked.parse(askEmail), () => {
                    document.getElementById('action-confirm-email').classList.remove('view-hidden');
                    document.getElementById('email-input').value = aiExtractedData.email;
                });
            }, 500);
        }

        // 最终步骤：触发报告发送逻辑
        async function finishProcess() {
            const finalEmail = document.getElementById('email-input').value;
            if(!finalEmail) return;

            document.getElementById('chat-actions').classList.add('view-hidden');
            appendUserMsg(`请发送到：${finalEmail}`);
            
            // 为了展示，切换到成功页
            setTimeout(() => {
                document.getElementById('step-3').classList.add('view-hidden');
                document.getElementById('step-4').classList.remove('view-hidden');
            }, 1000);

            // ==========================================
            // 后续动作：向飞书表格 Webhook 或 Formspree 提交线索
            // 这里可以替换成你们团队最终确认的 Webhook 地址
            // ==========================================
            /*
            try {
                await fetch('YOUR_FEISHU_WEBHOOK_URL_HERE', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: aiExtractedData.name,
                        email: finalEmail,
                        ai_summary: aiExtractedData.productDesc,
                        source: 'Centaur_TradeShow_H5'
                    })
                });
            } catch(e) {
                console.error("线索提交失败", e);
            }
            */
        }
    </script>
</body>
</html>
